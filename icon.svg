<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a14"/>
      <stop offset="1" stop-color="#0b0b14"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#e8173b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e8173b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c9"/>
      <stop offset=".45" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#c98500"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#spot)"/>
  <!-- ring ropes -->
  <g stroke-width="7" opacity=".85">
    <line x1="40" y1="392" x2="472" y2="392" stroke="#e23b4e"/>
    <line x1="40" y1="414" x2="472" y2="414" stroke="#f2f2f2"/>
    <line x1="40" y1="436" x2="472" y2="436" stroke="#3b6cff"/>
  </g>
  <!-- belt strap -->
  <rect x="28" y="196" width="456" height="118" rx="30" fill="url(#strap)" stroke="#000" stroke-width="4"/>
  <circle cx="70" cy="255" r="14" fill="url(#gold)"/>
  <circle cx="442" cy="255" r="14" fill="url(#gold)"/>
  <!-- center plate -->
  <path d="M256 92 L380 150 L380 330 Q256 420 132 330 L132 150 Z" fill="url(#gold)" stroke="#7a4f00" stroke-width="6"/>
  <path d="M256 116 L358 164 L358 318 Q256 392 154 318 L154 164 Z" fill="none" stroke="#7a4f00" stroke-width="4" opacity=".6"/>
  <!-- C -->
  <path d="M300 186 A66 66 0 1 0 300 300" fill="none" stroke="#c8102e" stroke-width="40" stroke-linecap="round"/>
  <path d="M300 186 A66 66 0 1 0 300 300" fill="none" stroke="#ff4a66" stroke-width="12" stroke-linecap="round" opacity=".55"/>
  <!-- star -->
  <path d="M256 128 l9 19 21 3 -15 15 4 21 -19 -10 -19 10 4 -21 -15 -15 21 -3z" fill="#fff" opacity=".95"/>
</svg>
